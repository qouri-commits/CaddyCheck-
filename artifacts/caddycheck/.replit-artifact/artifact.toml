kind = "mobile"
previewPath = "/"
title = "CaddyCheck"
version = "1.0.0"
id = "artifacts/caddycheck"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19011

[services.development]
run = "pnpm --filter @workspace/caddycheck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caddycheck", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/caddycheck", "run", "serve" ]

[services.env]
PORT = "19011"
BASE_PATH = "/"
